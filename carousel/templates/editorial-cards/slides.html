<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080" />
<title>AI Tools Daily Lab — Template 2 Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,300&display=swap" rel="stylesheet" />

<style>
  /* ── Reset ──────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #E8E7E2;
    font-family: 'DM Sans', Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 32px 0 48px;
  }

  /* ── Slide shell ────────────────────────────────── */
  .slide {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background: #FAFAF8;
  }

  /* ── Brand tokens ───────────────────────────────── */
  :root {
    --accent:      #C65A2E;
    --base:        #FAFAF8;
    --dark:        #1A1918;
    --mid:         #3D3B39;
    --muted:       #8C8A86;
    --card-bg:     #F0EFE9;
    --card-border: #E2E0D9;
  }


  .cover-title,
  .cover-subtitle,
  .slide-title,
  .outro-cta,
  .outro-sub {
    white-space: pre-line;
  }

  /* ── Shared utility ─────────────────────────────── */
  .label-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 100px;
  }
  .label-pill.ghost {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.75);
  }

  .brand-text       { font-size: 14px; font-weight: 500; letter-spacing: 0.06em; color: var(--muted); }
  .brand-text.light { color: rgba(255,255,255,0.5); }

  .slide-num       { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: var(--muted); }
  .slide-num.light { color: rgba(255,255,255,0.45); }

  .geo-ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid;
    pointer-events: none;
  }

  /* ── Footer bar ─────────────────────────────────── */
  .footer-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 52px;
    border-top: 1px solid var(--card-border);
  }
  .footer-bar.dark { border-top-color: rgba(255,255,255,0.1); }

  /* ── Slide counter badge ────────────────────────── */
  .counter-badge {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--muted);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 5px 12px;
    border-radius: 100px;
  }

  /* ═══════════════════════════════════════════════════
     COVER SLIDE
  ═══════════════════════════════════════════════════ */
  .slide-cover { background: var(--dark); }

  .slide-cover .bg-numeral {
    position: absolute;
    top: -40px; right: -20px;
    font-size: 560px; font-weight: 800; line-height: 1;
    color: rgba(255,255,255,0.04);
    letter-spacing: -0.05em;
    user-select: none; pointer-events: none;
  }

  .slide-cover .dot-grid {
    position: absolute;
    bottom: 120px; left: 52px;
    display: grid;
    grid-template-columns: repeat(5, 8px);
    grid-template-rows: repeat(3, 8px);
    gap: 10px;
  }
  .slide-cover .dot-grid span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(198,90,46,0.45);
    display: block;
  }

  .slide-cover .cover-inner {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 72px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 52px 60px;
  }

  .slide-cover .cover-label-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
  }
  .slide-cover .cover-rule {
    flex: 1; height: 1px;
    background: rgba(255,255,255,0.12);
  }

  .slide-cover .cover-title {
    font-size: 90px; font-weight: 800;
    line-height: 1.0; letter-spacing: -0.03em;
    color: #fff;
    white-space: pre-line;
    margin-bottom: 28px;
  }
  .slide-cover .cover-subtitle {
    font-size: 22px; font-weight: 300;
    line-height: 1.5;
    color: rgba(255,255,255,0.55);
    white-space: pre-line;
    max-width: 580px;
  }

  /* ═══════════════════════════════════════════════════
     CONTENT SLIDES
  ═══════════════════════════════════════════════════ */
  .slide-content .bg-numeral {
    position: absolute;
    top: -30px; right: -10px;
    font-size: 520px; font-weight: 800; line-height: 1;
    color: rgba(26,25,24,0.04);
    letter-spacing: -0.05em;
    user-select: none; pointer-events: none;
  }

  .slide-content .cs-geo-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    pointer-events: none;
  }

  .slide-content .header-area {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 210px;
    padding: 52px 52px 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .slide-content .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .slide-content .slide-title {
    font-size: 44px; font-weight: 800;
    line-height: 1.1; letter-spacing: -0.02em;
    color: var(--dark);
    white-space: pre-line;
  }
  .slide-content .title-rule {
    width: 48px; height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin-top: 12px;
  }

  .slide-content .cards-area {
    position: absolute;
    top: 210px; left: 0; right: 0; bottom: 72px;
    padding: 0 52px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    justify-content: center;
  }

  .cs-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 28px 32px;
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 0 24px;
    position: relative;
    overflow: hidden;
  }
  .cs-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    border-radius: 16px 16px 0 0;
  }
  .cs-card.muted::before { opacity: 0.35; }

  .cs-card-num {
    font-size: 36px; font-weight: 800; line-height: 1;
    color: var(--accent); opacity: 0.35;
    padding-top: 2px; letter-spacing: -0.02em;
  }
  .cs-card-tag {
    display: inline-block;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--accent);
    background: rgba(198,90,46,0.1);
    padding: 3px 10px; border-radius: 100px;
    margin-bottom: 10px;
  }
  .cs-card-name {
    font-size: 20px; font-weight: 700;
    color: var(--dark); margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .cs-card-desc {
    font-size: 16px; font-weight: 400;
    line-height: 1.55; color: var(--mid);
  }

  /* ═══════════════════════════════════════════════════
     OUTRO SLIDE
  ═══════════════════════════════════════════════════ */
  .slide-outro { background: var(--accent); }

  .slide-outro .bg-numeral {
    position: absolute;
    bottom: -80px; right: -30px;
    font-size: 560px; font-weight: 800; line-height: 1;
    color: rgba(255,255,255,0.07);
    letter-spacing: -0.05em;
    user-select: none; pointer-events: none;
  }

  .slide-outro .outro-inner {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 52px;
  }
  .slide-outro .outro-eyebrow {
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    margin-bottom: 28px;
  }
  .slide-outro .outro-cta {
    font-size: 76px; font-weight: 800;
    line-height: 1.0; letter-spacing: -0.03em;
    color: #fff;
    white-space: pre-line;
    margin-bottom: 40px;
  }
  .slide-outro .outro-sub {
    font-size: 20px; font-weight: 300;
    color: rgba(255,255,255,0.65);
    line-height: 1.55;
    white-space: pre-line;
    max-width: 560px;
    margin-bottom: 52px;
  }
  .slide-outro .outro-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.15);
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 16px; font-weight: 600;
    padding: 14px 28px; border-radius: 100px;
    letter-spacing: 0.02em;
    width: fit-content;
  }
</style>
</head>
<body>

<script>
/* ── Helpers ──────────────────────────────────────── */
function getDataUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("data") || "./example.json";
}

function cleanText(value) {
  return typeof value === "string" ? value.replace(/\\n/g, "\n") : (value || "");
}

function escapeHtml(value) {
  return cleanText(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function nl(value) {
  // CSS uses white-space: pre-line, so real newline characters render correctly.
  return escapeHtml(value);
}

function safe(value) {
  return escapeHtml(value);
}

function slideNumberOnly(slide) {
  const raw = cleanText(slide.slide_num || slide.number || "");
  return raw.split(" ")[0] || "";
}

function buildCover(slide, brand, series) {
  return `
  <div class="slide slide-cover" id="${safe(slide.id)}" data-slide-type="cover">
    <div class="geo-ring" style="top:-180px;left:-180px;width:440px;height:440px;border-color:rgba(198,90,46,0.2);"></div>
    <div class="geo-ring" style="top:-100px;left:-100px;width:280px;height:280px;border-color:rgba(198,90,46,0.1);"></div>
    <div class="geo-ring" style="top:40px;right:40px;width:120px;height:120px;border-color:rgba(255,255,255,0.06);"></div>
    <div class="geo-ring" style="top:70px;right:70px;width:60px;height:60px;border-color:rgba(255,255,255,0.08);"></div>
    <div class="bg-numeral" aria-hidden="true">01</div>
    <div class="dot-grid" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="cover-inner">
      <div class="cover-label-row">
        <span class="label-pill ghost">${safe(slide.category)}</span>
        <div class="cover-rule"></div>
        <span class="slide-num light">${safe(slide.slide_num)}</span>
      </div>
      <h1 class="cover-title" data-key="title">${nl(slide.title)}</h1>
      <p class="cover-subtitle" data-key="subtitle">${nl(slide.subtitle)}</p>
    </div>
    <div class="footer-bar dark">
      <span class="brand-text light" data-key="brand">${safe(brand)}</span>
      <span class="label-pill ghost" data-key="series">${safe(series)}</span>
    </div>
  </div>`;
}

function buildContent(slide, brand, series, idx) {
  // Alternate geo-ring positions for visual variety
  const ringPositions = [
    'top:-120px;right:-120px;width:340px;height:340px;',
    'bottom:-140px;left:-140px;width:360px;height:360px;',
    'top:-100px;right:-100px;width:300px;height:300px;',
    'bottom:-160px;right:-160px;width:400px;height:400px;'
  ];
  const ringPositions2 = [
    'top:-60px;right:-60px;width:200px;height:200px;',
    'bottom:-70px;left:-70px;width:210px;height:210px;',
    'top:60px;right:60px;width:140px;height:140px;',
    'bottom:-80px;right:-80px;width:230px;height:230px;'
  ];
  const ri = idx % 4;

  const cards = (slide.items || []).map((item, i) => `
    <div class="cs-card${i > 0 ? ' muted' : ''}">
      <div class="cs-card-num">0${i + 1}</div>
      <div class="cs-card-body">
        <div class="cs-card-tag">${safe(item.tag)}</div>
        <div class="cs-card-name">${safe(item.name)}</div>
        <div class="cs-card-desc">${safe(item.desc)}</div>
      </div>
    </div>`).join('');

  return `
  <div class="slide slide-content" id="${safe(slide.id)}" data-slide-type="content">
    <div class="bg-numeral" aria-hidden="true">${slideNumberOnly(slide)}</div>
    <div class="cs-geo-ring" style="${ringPositions[ri]}"></div>
    <div class="cs-geo-ring" style="${ringPositions2[ri]}"></div>
    <div class="header-area">
      <div class="header-top">
        <span class="label-pill" data-key="category">${safe(slide.category)}</span>
        <span class="counter-badge" data-key="slide_num">${safe(slide.slide_num)}</span>
      </div>
      <h2 class="slide-title" data-key="title">${nl(slide.title)}</h2>
      <div class="title-rule"></div>
    </div>
    <div class="cards-area">${cards}</div>
    <div class="footer-bar">
      <span class="brand-text" data-key="brand">${safe(brand)}</span>
      <span class="brand-text" data-key="series">${safe(series)}</span>
    </div>
  </div>`;
}

function buildOutro(slide, brand) {
  return `
  <div class="slide slide-outro" id="${safe(slide.id)}" data-slide-type="outro">
    <div class="bg-numeral" aria-hidden="true">${slideNumberOnly(slide)}</div>
    <div class="geo-ring" style="bottom:-200px;right:-200px;width:520px;height:520px;border-color:rgba(255,255,255,0.12);"></div>
    <div class="geo-ring" style="bottom:-100px;right:-100px;width:320px;height:320px;border-color:rgba(255,255,255,0.08);"></div>
    <div class="geo-ring" style="top:48px;left:48px;width:80px;height:80px;border-color:rgba(255,255,255,0.2);"></div>
    <div class="geo-ring" style="top:64px;left:64px;width:48px;height:48px;border-color:rgba(255,255,255,0.12);"></div>
    <div class="outro-inner">
      <p class="outro-eyebrow" data-key="category">${safe(slide.category)}</p>
      <h2 class="outro-cta" data-key="cta">${nl(slide.cta)}</h2>
      <p class="outro-sub" data-key="subtitle">${nl(slide.subtitle)}</p>
      <div class="outro-pill" data-key="cta_action">
        <span>${safe(slide.cta_action)}</span>
        <span style="font-size:20px;line-height:1;">→</span>
      </div>
    </div>
    <div class="footer-bar dark">
      <span class="brand-text light" data-key="brand">${safe(brand)}</span>
      <span class="slide-num light" data-key="slide_num">${safe(slide.slide_num)}</span>
    </div>
  </div>`;
}

async function render() {
  window.__CAROUSEL_READY__ = false;

  const dataUrl = getDataUrl();
  const res = await fetch(dataUrl);

  if (!res.ok) {
    throw new Error(`Failed to load data from ${dataUrl}: ${res.status} ${res.statusText}`);
  }

  const data = await res.json();
  const brand = data.brand || "ai.tools.daily.lab";
  const series = data.series || data.template || "Developer Edition";
  const slides = Array.isArray(data.slides) ? data.slides : [];

  if (data.accent) {
    document.documentElement.style.setProperty("--accent", data.accent);
  }

  let html = "";
  let contentIdx = 0;

  for (const slide of slides) {
    if (slide.type === "cover") {
      html += buildCover(slide, brand, series);
    } else if (slide.type === "content" || slide.type === "list") {
      html += buildContent(slide, brand, series, contentIdx++);
    } else if (slide.type === "outro") {
      html += buildOutro(slide, brand);
    }
  }

  document.body.innerHTML = html;
  window.__CAROUSEL_READY__ = true;
}

render().catch(err => {
  window.__CAROUSEL_READY__ = false;
  document.body.innerHTML = `<pre style="color:red;padding:40px;font-family:monospace;white-space:pre-wrap;">${escapeHtml(err.stack || err.message || String(err))}</pre>`;
});
</script>

</body>
</html>
