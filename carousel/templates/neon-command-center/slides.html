<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>neon-command-center</title><style> :root{--bg:#070A12;--bg2:#0B1020;--panel:rgba(14,20,38,.76);--panel2:rgba(10,16,30,.9);--line:rgba(0,229,255,.18);--text:#EAF2FF;--muted:#9AA8C7;--cyan:#00E5FF;--violet:#8B5CF6;--orange:#C65A2E;--shadow:0 24px 80px rgba(0,0,0,.45);} *{box-sizing:border-box} html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;} body{overflow-y:auto;} .slide{position:relative;width:1080px;height:1080px;margin:0 auto;overflow:hidden;background:radial-gradient(circle at 20% 20%, rgba(139,92,246,.16), transparent 28%),radial-gradient(circle at 80% 30%, rgba(0,229,255,.13), transparent 24%),linear-gradient(180deg,#070A12 0%,#0B1020 100%);border-bottom:1px solid rgba(255,255,255,.04);} .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(0,229,255,.06) 1px, transparent 1px);background-size:60px 60px;mask-image:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.18));pointer-events:none;opacity:.6;} .noise{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px);background-size:3px 3px;mix-blend-mode:soft-light;pointer-events:none;opacity:.18} .wrap{position:relative;width:100%;height:100%;padding:56px;} .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)} .brand{display:flex;align-items:center;gap:14px;font-weight:700;color:var(--text)} .brand-dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 0 18px rgba(0,229,255,.65)} .badge{padding:10px 14px;border:1px solid rgba(0,229,255,.26);border-radius:999px;background:rgba(0,229,255,.06);color:#BFF9FF;font-size:14px;letter-spacing:.08em;text-transform:uppercase} .panel{background:linear-gradient(180deg,rgba(18,25,44,.88),rgba(9,14,28,.92));border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);border-radius:28px;backdrop-filter:blur(10px)} .cover-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;height:910px;align-items:stretch} .title{font-size:76px;line-height:.96;font-weight:800;letter-spacing:-.05em;margin:18px 0 18px;white-space:pre-line} .sub{font-size:24px;line-height:1.45;color:var(--muted);max-width:520px;white-space:pre-line} .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:28px} .kpi{padding:18px 18px 16px;border-radius:22px;background:linear-gradient(180deg,rgba(0,229,255,.08),rgba(139,92,246,.05));border:1px solid rgba(0,229,255,.16)} .kpi .n{font-size:34px;font-weight:800;color:#F3FBFF;margin-bottom:6px} .kpi .l{font-size:16px;color:var(--muted)} .terminal{display:flex;flex-direction:column;height:100%;padding:22px} .term-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px} .lights{display:flex;gap:8px}.light{width:12px;height:12px;border-radius:50%}.red{background:#FF5F56}.yel{background:#FFBD2E}.grn{background:#27C93F}.term-title{font-size:14px;color:#B9C7E7;letter-spacing:.12em;text-transform:uppercase} .screen{flex:1;border-radius:22px;padding:22px;background:linear-gradient(180deg,rgba(6,10,18,.94),rgba(10,16,30,.82));border:1px solid rgba(0,229,255,.16);position:relative;overflow:hidden} .screen:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,229,255,.06),transparent);transform:translateX(-50%);} .screen-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:18px;line-height:1.35}.screen-row:last-child{border-bottom:none}.screen-label{color:#AFC0E2}.screen-val{color:#F4FBFF;font-weight:700;text-align:right;white-space:pre-line}.status{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{padding:10px 12px;border-radius:999px;font-size:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#D9E7FF}.pill.cyan{border-color:rgba(0,229,255,.26);background:rgba(0,229,255,.08)}.pill.violet{border-color:rgba(139,92,246,.28);background:rgba(139,92,246,.08)}.pill.orange{border-color:rgba(198,90,46,.32);background:rgba(198,90,46,.1)} .content-grid{display:grid;grid-template-columns:360px 1fr;gap:26px;height:910px}.status-panel{padding:24px;display:flex;flex-direction:column}.section-label{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#A9B6D6;margin-bottom:14px}.big-stat{font-size:58px;font-weight:900;line-height:1;color:#F5FBFF;margin:0 0 10px}.stat-desc{font-size:22px;color:var(--muted);line-height:1.4;white-space:pre-line}.meter{margin-top:24px;padding:18px;border-radius:22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}.meter-top{display:flex;justify-content:space-between;font-size:16px;color:#BED0F2;margin-bottom:12px}.bar{height:14px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 18px rgba(0,229,255,.45)} .insights{display:grid;grid-template-rows:repeat(3,1fr);gap:18px}.insight{padding:24px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}.insight h3{margin:0;font-size:34px;line-height:1.02;white-space:pre-line}.insight p{margin:12px 0 0;font-size:20px;line-height:1.45;color:var(--muted);white-space:pre-line}.tag{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#B8C7E7;padding:9px 11px;border-radius:999px;border:1px solid rgba(0,229,255,.18);background:rgba(0,229,255,.06);align-self:start} .outro{display:flex;flex-direction:column;justify-content:space-between;height:910px;padding:34px} .outro-cta{padding:30px;border-radius:30px;border:1px solid rgba(0,229,255,.22);background:linear-gradient(180deg,rgba(0,229,255,.08),rgba(139,92,246,.08));box-shadow:0 0 0 1px rgba(198,90,46,.14),0 20px 70px rgba(0,0,0,.42)} .outro-title{font-size:70px;line-height:.98;font-weight:900;letter-spacing:-.05em;margin:0;white-space:pre-line} .outro-sub{font-size:24px;line-height:1.45;color:#D5E0F8;margin-top:16px;max-width:760px;white-space:pre-line} .footer{display:flex;justify-content:space-between;align-items:flex-end;padding-top:20px;color:var(--muted);font-size:16px;letter-spacing:.08em;text-transform:uppercase} .codebar{display:flex;gap:12px;flex-wrap:wrap} .mini{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#DDE8FF} .accent-line{height:3px;width:180px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--orange));border-radius:999px;margin-top:18px;box-shadow:0 0 24px rgba(0,229,255,.35)} </style></head><body><div id="app"></div><script>function getDataUrl() { const params = new URLSearchParams(window.location.search); return params.get("data") || "./example.json"; } function cleanText(value) { return typeof value === "string" ? value.replace(/\\n/g, "\n") : (value || ""); } function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))} async function main(){ const data=await fetch(getDataUrl()).then(r=>r.json()); const slides=data.slides||[]; const app=document.getElementById('app'); app.innerHTML=slides.map((slide,idx)=>{ if(slide.type==='cover'){ return `<section class="slide"><div class="grid"></div><div class="noise"></div><div class="wrap"><div class="topbar"><div class="brand"><span class="brand-dot"></span><span>ai.tools.daily.lab</span></div><div class="badge">${esc(cleanText(slide.badge))}</div></div><div class="cover-grid"><div class="panel" style="padding:32px;display:flex;flex-direction:column;justify-content:space-between"><div><div class="section-label">${esc(cleanText(slide.kicker))}</div><h1 class="title">${esc(cleanText(slide.title))}</h1><div class="sub">${esc(cleanText(slide.subtitle))}</div></div><div><div class="kpis">${(slide.kpis||[]).map(k=>`<div class="kpi"><div class="n">${esc(cleanText(k.value))}</div><div class="l">${esc(cleanText(k.label))}</div></div>`).join('')}</div></div></div><div class="panel terminal"><div class="term-head"><div class="lights"><span class="light red"></span><span class="light yel"></span><span class="light grn"></span></div><div class="term-title">${esc(cleanText(slide.panel_title))}</div></div><div class="screen">${(slide.panel_rows||[]).map(r=>`<div class="screen-row"><div class="screen-label">${esc(cleanText(r.label))}</div><div class="screen-val">${esc(cleanText(r.value))}</div></div>`).join('')}<div class="status">${(slide.badges||[]).map(b=>`<div class="pill ${esc(cleanText(b.variant||""))}">${esc(cleanText(b.text))}</div>`).join('')}</div></div></div></div></section>`; } if(slide.type==='content'){ return `<section class="slide"><div class="grid"></div><div class="noise"></div><div class="wrap"><div class="topbar"><div class="brand"><span class="brand-dot"></span><span>ai.tools.daily.lab</span></div><div class="badge">${esc(cleanText(slide.badge))}</div></div><div class="content-grid"><div class="panel status-panel"><div class="section-label">${esc(cleanText(slide.kicker))}</div><div class="big-stat">${esc(cleanText(slide.metric))}</div><div class="stat-desc">${esc(cleanText(slide.description))}</div><div class="meter"><div class="meter-top"><span>${esc(cleanText(slide.meter_label))}</span><span>${esc(cleanText(slide.meter_value))}</span></div><div class="bar"><div class="fill" style="width:${esc(cleanText(slide.meter_percent))}%"></div></div></div><div class="codebar">${(slide.footer_tags||[]).map(t=>`<div class="mini">${esc(cleanText(t))}</div>`).join('')}</div></div><div class="insights">${(slide.items||[]).map(it=>`<div class="panel insight"><div><div class="tag">${esc(cleanText(it.tag))}</div><h3>${esc(cleanText(it.title))}</h3><p>${esc(cleanText(it.text))}</p></div><div class="tag">${esc(cleanText(it.badge))}</div></div>`).join('')}</div></div></div></section>`; } return `<section class="slide"><div class="grid"></div><div class="noise"></div><div class="wrap"><div class="topbar"><div class="brand"><span class="brand-dot"></span><span>ai.tools.daily.lab</span></div><div class="badge">${esc(cleanText(slide.badge))}</div></div><div class="outro panel"><div class="outro-cta"><div class="section-label">${esc(cleanText(slide.kicker))}</div><h2 class="outro-title">${esc(cleanText(slide.title))}</h2><div class="outro-sub">${esc(cleanText(slide.subtitle))}</div><div class="accent-line"></div></div><div class="footer"><div>${esc(cleanText(slide.footer_left))}</div><div class="codebar">${(slide.footer_tags||[]).map(t=>`<div class="mini">${esc(cleanText(t))}</div>`).join('')}</div></div></div></div></section>`; }).join(''); } main(); </script></body></html>
