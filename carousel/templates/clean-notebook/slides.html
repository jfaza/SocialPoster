<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>clean-notebook</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#FAFAF8;color:#1F1B16;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-y:auto}.slide{width:1080px;height:1080px;position:relative;overflow:hidden;background:#FAFAF8;border-bottom:1px solid #E7E0D7}.slide-inner{width:100%;height:100%;padding:64px 72px 56px 72px;display:flex;flex-direction:column}.tag{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;padding:10px 16px;border-radius:999px;background:rgba(198,90,46,.12);color:#C65A2E;font-size:18px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}.title{margin:26px 0 16px 0;font-family:Georgia,"Times New Roman",serif;font-size:58px;line-height:1.04;font-weight:700;letter-spacing:-.02em;white-space:pre-line;max-width:860px}.subtitle{margin:0 0 28px 0;font-size:24px;line-height:1.5;color:#5B544C;white-space:pre-line;max-width:900px}.panel{flex:1;background:#FFFDFC;border:1px solid #E7E0D7;border-radius:28px;box-shadow:0 10px 30px rgba(31,27,22,.05);padding:28px 30px;display:flex;flex-direction:column;gap:0}.panel-header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px}.panel-kicker{font-size:18px;font-weight:700;color:#C65A2E;text-transform:uppercase;letter-spacing:.08em}.panel-meta{font-size:17px;color:#8A8178;white-space:pre-line;text-align:right;max-width:340px}.list{display:flex;flex-direction:column}.item{display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-top:1px solid #E8E1D8}.item:first-child{border-top:none}.check{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:1.5px solid #D5CCC1;background:linear-gradient(180deg,#FFF8F4,#FFF);display:flex;align-items:center;justify-content:center;color:#C65A2E;font-weight:800;font-size:18px;line-height:1;margin-top:2px}.item-content{flex:1;min-width:0}.item-title{font-size:27px;line-height:1.18;font-weight:650;white-space:pre-line;margin:0 0 6px 0}.item-body{font-size:20px;line-height:1.55;color:#5B544C;white-space:pre-line;margin:0}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:15px;color:#A39A90}.brand{letter-spacing:.06em;text-transform:lowercase}.page-no{color:#B0A79D}.cover{justify-content:space-between}.cover-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.cover-hero{margin-top:22px;display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.cover-card{background:#FFFDFC;border:1px solid #E7E0D7;border-radius:28px;box-shadow:0 10px 30px rgba(31,27,22,.05);padding:28px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}.stat{padding:18px;border-radius:20px;background:#FAF5F0;border:1px solid #E8DDD2}.stat-label{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:#8A8178;margin-bottom:10px}.stat-value{font-size:26px;line-height:1.2;font-weight:700;color:#1F1B16;white-space:pre-line}.cover-note{font-size:22px;line-height:1.55;color:#5B544C;white-space:pre-line}.outro-center{display:flex;align-items:center;justify-content:center;flex:1}.outro-box{text-align:center;max-width:760px}.outro-cta{display:inline-block;margin-top:28px;font-size:22px;font-weight:700;color:#C65A2E;white-space:pre-line}</style></head><body><div id="app"></div><script>
function getDataUrl(){const p=new URLSearchParams(window.location.search);return p.get("data")||"./example.json";}
function cleanText(v){return typeof v==="string"?v.replace(/\\n/g,"\n"):(v||"");}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));}

function renderCover(s,idx){
  const stats=(s.stats||[]);
  const statsHtml=stats.length?`<div class="stat-grid">${stats.map(st=>`<div class="stat"><div class="stat-label">${esc(cleanText(st.label))}</div><div class="stat-value">${esc(cleanText(st.value))}</div></div>`).join("")}</div>`:"";
  const hasSide=s.side_note||(stats.length>0);
  const sideHtml=hasSide?`<div class="cover-card" style="width:310px">${s.side_label?`<div class="panel-kicker">${esc(cleanText(s.side_label))}</div>`:""}<div class="cover-note" style="margin-top:14px">${esc(cleanText(s.side_note))}</div>${statsHtml}</div>`:"";
  const hasHero=s.hero_text,hasTake=s.takeaway_text;
  const heroHtml=(hasHero||hasTake)?`<div class="cover-hero">${hasHero?`<div class="cover-card"><div class="panel-kicker">${esc(cleanText(s.hero_label))}</div><div class="cover-note" style="margin-top:14px">${esc(cleanText(s.hero_text))}</div></div>`:""} ${hasTake?`<div class="cover-card"><div class="panel-kicker">${esc(cleanText(s.takeaway_label))}</div><div class="cover-note" style="margin-top:14px">${esc(cleanText(s.takeaway_text))}</div></div>`:""}</div>`:"";
  const hasExtra=hasSide||hasHero||hasTake;
  // Simple centered cover when no extra cards; rich multi-card cover when populated
  if(!hasExtra){
    const ctaHtml=s.cta?`<div class="outro-cta" style="margin-top:32px">${esc(cleanText(s.cta))}</div>`:"";
    return `<section class="slide"><div class="slide-inner"><div class="tag">${esc(cleanText(s.tag))}</div><div class="outro-center"><div class="outro-box"><div class="title" style="max-width:none;font-size:72px">${esc(cleanText(s.title))}</div><div class="subtitle" style="max-width:none;font-size:26px">${esc(cleanText(s.subtitle))}</div>${ctaHtml}</div></div><div class="footer"><div class="brand">ai.tools.daily.lab</div><div class="page-no">01</div></div></div></section>`;
  }
  return `<section class="slide cover"><div class="slide-inner"><div><div class="cover-top"><div><div class="tag">${esc(cleanText(s.tag))}</div><div class="title">${esc(cleanText(s.title))}</div><div class="subtitle">${esc(cleanText(s.subtitle))}</div></div>${sideHtml}</div>${heroHtml}</div><div class="footer"><div class="brand">ai.tools.daily.lab</div><div class="page-no">01</div></div></div></section>`;
}

function renderOutro(s,idx){
  let extraHtml="";
  if(s.cta_title){
    extraHtml=`<div class="panel" style="margin-top:24px"><div class="panel-header"><div class="panel-kicker">${esc(cleanText(s.panel_kicker))}</div><div class="panel-meta">${esc(cleanText(s.panel_meta))}</div></div><div class="item" style="border-top:none;padding-top:0"><div class="check">&#x2713;</div><div class="item-content"><div class="item-title">${esc(cleanText(s.cta_title))}</div><div class="item-body">${esc(cleanText(s.cta_body))}</div></div></div></div>`;
  } else if(s.cta){
    extraHtml=`<div class="outro-cta">${esc(cleanText(s.cta))}</div>`;
  }
  return `<section class="slide"><div class="slide-inner"><div class="tag">${esc(cleanText(s.tag))}</div><div class="outro-center"><div class="outro-box"><div class="title" style="max-width:none">${esc(cleanText(s.title))}</div><div class="subtitle" style="max-width:none">${esc(cleanText(s.subtitle))}</div>${extraHtml}</div></div><div class="footer"><div class="brand">ai.tools.daily.lab</div><div class="page-no">06</div></div></div></section>`;
}

function renderContent(s,idx){
  const items=(s.items||[]).map(it=>`<div class="item"><div class="check">&#x2713;</div><div class="item-content"><div class="item-title">${esc(cleanText(it.title))}</div>${it.body?`<div class="item-body">${esc(cleanText(it.body))}</div>`:""}</div></div>`).join("");
  const header=(s.panel_kicker||s.panel_meta)?`<div class="panel-header"><div class="panel-kicker">${esc(cleanText(s.panel_kicker))}</div><div class="panel-meta">${esc(cleanText(s.panel_meta))}</div></div>`:"";
  const num=String(s.slide_num||idx+1).padStart(2,"0");
  return `<section class="slide"><div class="slide-inner"><div class="tag">${esc(cleanText(s.tag))}</div><div class="title">${esc(cleanText(s.title))}</div>${s.subtitle?`<div class="subtitle">${esc(cleanText(s.subtitle))}</div>`:""}<div class="panel">${header}<div class="list">${items}</div></div><div class="footer"><div class="brand">ai.tools.daily.lab</div><div class="page-no">${esc(num)}</div></div></div></section>`;
}

fetch(getDataUrl()).then(r=>r.json()).then(data=>{
  const slides=Array.isArray(data.slides)?data.slides:[data];
  document.getElementById("app").innerHTML=slides.map((s,i)=>{
    if(s.type==="cover")return renderCover(s,i);
    if(s.type==="outro")return renderOutro(s,i);
    return renderContent(s,i);
  }).join("");
}).catch(err=>{document.getElementById("app").innerHTML='<div style="padding:40px">Failed to load data</div>';console.error(err);});
</script></body></html>
