<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>news-card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #EFEFEF;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body { display: flex; flex-direction: column; align-items: center; }

  .slide {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #FFFFFF;
    border-bottom: 1px solid #DDE3ED;
  }

  /* ── IMAGE PANEL (top 62%) ── */
  .img-panel {
    width: 100%;
    height: 670px;
    position: relative;
    background: linear-gradient(145deg, #0D1B3E 0%, #1e3a8a 60%, #2563EB 100%);
    background-size: cover;
    background-position: center center;
    overflow: hidden;
  }

  /* Darken bottom of image so source text is readable */
  .img-panel::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.08) 0%,
      rgba(0,0,0,0.0) 40%,
      rgba(0,0,0,0.55) 80%,
      rgba(0,0,0,0.72) 100%
    );
  }

  .channel-badge {
    position: absolute;
    top: 28px;
    left: 32px;
    background: #2563EB;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 9px 18px;
    border-radius: 999px;
    z-index: 2;
    box-shadow: 0 4px 16px rgba(37,99,235,0.4);
  }

  .img-footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 32px 22px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    z-index: 2;
  }

  .source-name {
    color: rgba(255,255,255,0.92);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .article-date {
    color: rgba(255,255,255,0.65);
    font-size: 14px;
    font-weight: 400;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  /* ── TEXT PANEL (bottom 38%) ── */
  .text-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 410px;
    background: #FFFFFF;
    padding: 24px 40px 28px;
    display: flex;
    flex-direction: column;
  }

  .panel-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-shrink: 0;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-row img {
    height: 26px;
    width: auto;
    display: block;
  }

  .logo-fallback {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #0D1B3E;
  }

  .slide-counter {
    font-size: 13px;
    font-weight: 600;
    color: #9CA3AF;
    letter-spacing: 0.08em;
    flex-shrink: 0;
  }

  .headline {
    font-size: 28px;
    font-weight: 800;
    color: #0D1B3E;
    letter-spacing: -0.025em;
    line-height: 1.2;
    word-break: break-word;
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    margin-bottom: 12px;
  }

  .summary {
    font-size: 15px;
    color: #4B5563;
    line-height: 1.6;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    flex-shrink: 0;
  }

  /* ── NO-IMAGE FALLBACK ── */
  .no-image-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 1;
  }

  .no-image-source {
    font-size: 52px;
    font-weight: 800;
    color: rgba(255,255,255,0.88);
    text-align: center;
    letter-spacing: -0.03em;
    line-height: 1.1;
    padding: 0 48px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }

  .no-image-label {
    font-size: 14px;
    font-weight: 700;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
function getDataUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("data") || "./example.json";
}
function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function cleanText(v) {
  return typeof v === "string" ? v.replace(/\\n/g,"\n") : (v || "");
}

function renderSlide(s, i, data) {
  const slides = data.slides || [];
  const num   = String(s.slide_num || i + 1).padStart(2, "0");
  const total = String(slides.length).padStart(2, "0");

  const hasImage = s.image && s.image.trim().length > 0;

  const imgStyle = hasImage
    ? `background-image:url("${esc(s.image)}");background-size:cover;background-position:center;`
    : "";

  const noImgHtml = !hasImage
    ? `<div class="no-image-content">
         <div class="no-image-source">${esc(cleanText(s.source || s.category || ""))}</div>
         <div class="no-image-label">${esc(cleanText(s.category || "News"))}</div>
       </div>`
    : "";

  const dateHtml = s.date
    ? `<span class="article-date">${esc(cleanText(s.date))}</span>`
    : "";

  const summaryHtml = s.subtitle
    ? `<div class="summary">${esc(cleanText(s.subtitle))}</div>`
    : "";

  const brand = esc(data.brand || "");

  return `
<div class="slide">
  <div class="img-panel" style="${imgStyle}">
    ${noImgHtml}
    <div class="channel-badge">${esc(cleanText(s.category || "News"))}</div>
    <div class="img-footer">
      <span class="source-name">${esc(cleanText(s.source || ""))}</span>
      ${dateHtml}
    </div>
  </div>
  <div class="text-panel">
    <div class="panel-top">
      <div class="logo-row">
        <img src="/assets/logo.svg" alt="${brand}" onerror="this.style.display='none'">
        <span class="logo-fallback">${brand}</span>
      </div>
      <span class="slide-counter">${num} / ${total}</span>
    </div>
    <div class="headline">${esc(cleanText(s.title || ""))}</div>
    ${summaryHtml}
  </div>
</div>`;
}

async function load() {
  const res  = await fetch(getDataUrl());
  const data = await res.json();
  document.getElementById("root").innerHTML =
    (data.slides || []).map((s, i) => renderSlide(s, i, data)).join("");
}
load();
</script>
</body>
</html>
